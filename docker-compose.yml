services:
  # ─── 1. INFRASTRUCTURE ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: disguise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-disguise_local_pass_2026}
      POSTGRES_DB: disguiseid
    ports:
      - "127.0.0.1:5432:5432" # Dikunci ke localhost (kebal dari scanning IP lokal / 172.125.0.0/21)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: disguise-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Dikunci ke localhost
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: disguise-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9001:9001" # Web Console dikunci ke localhost (bisa diakses via SSH Tunnel)
      # Port 9000 (S3 API) tidak di-expose ke host publik; diakses melalui Caddy storage.{$DOMAIN_NAME}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: disguise-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP ingest port (Push stream dari CCTV Tapo / Raspberry Pi)
      - "8189:8189/udp" # WebRTC ICE UDP media traffic
      - "8189:8189/tcp" # WebRTC ICE TCP media traffic
      - "127.0.0.1:8888:8888" # HLS internal
      - "127.0.0.1:8889:8889" # WHEP WebRTC internal (publik via stream.{$DOMAIN_NAME} Caddy)
      - "127.0.0.1:9997:9997" # MediaMTX API internal
    volumes:
      - ./infrastructure/mediamtx.yml:/mediamtx.yml

  # ─── 2. ML SERVICE V2 (GSIVAE + ArcFace v2.1) ───────────────
  ml-service:
    build:
      context: ./ml-service-v2
      dockerfile: Dockerfile
    container_name: disguise-ml-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8001" # Dikunci ke localhost, backend panggil internal via http://ml-service:8001
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-WalMWH1hinTEutYiOoeVeH8NYG-9d0P8DunLSlwYzGtgSCabPbN-bfQlQmBDtgec}
      - REQUIRE_CUDA=false
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1" ]
    volumes:
      - ./ml-service-v2/weights:/app/weights
    # Uncomment jika menggunakan NVIDIA GPU pada Docker host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # ─── 3. BACKEND (Express Node.js v2.1) ──────────────────────
  backend:
    build:
      context: ./disguise-backend
      dockerfile: Dockerfile
    container_name: disguise-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3002}:3000" # Dikunci ke localhost, publik via api.{$DOMAIN_NAME}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${DB_PASSWORD:-disguise_local_pass_2026}@postgres:5432/disguiseid}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-https://storage.disguise.id}
      - JWT_SECRET=${JWT_SECRET:-super_secret_for_dev}
      - ML_SERVICE_URL=http://ml-service:8001
      - ML_SERVICE_V2_URL=http://ml-service:8001
      - ML_SERVICE_V2_ENABLED=true
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-WalMWH1hinTEutYiOoeVeH8NYG-9d0P8DunLSlwYzGtgSCabPbN-bfQlQmBDtgec}
      - ML_SERVICE_V2_API_KEY=${ML_SERVICE_API_KEY:-WalMWH1hinTEutYiOoeVeH8NYG-9d0P8DunLSlwYzGtgSCabPbN-bfQlQmBDtgec}
      - RATE_LIMIT_CAMERA_MAX=10000
      - CAMERA_CREDENTIAL_ENCRYPTION_ENABLED=true
      - CAMERA_CREDENTIAL_KEY_VERSION=v1
      - CAMERA_CREDENTIAL_KEY_BASE64=${CAMERA_CREDENTIAL_KEY_BASE64:-ISzqe6KmlEjDs/nSiKl4us1y8PdGyy5zhyUAIWZdebY=}
      - MEDIAMTX_API_URL=http://mediamtx:9997
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 4. FRONTEND (Next.js v2.1) ─────────────────────────────
  frontend:
    build:
      context: ./disguise-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.disguise.id}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.disguise.id}
        NEXT_PUBLIC_MEDIAMTX_WHEP_BASE_URL: ${NEXT_PUBLIC_MEDIAMTX_WHEP_BASE_URL:-https://stream.disguise.id}
    container_name: disguise-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001" # Dikunci ke localhost, publik via {$DOMAIN_NAME}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.disguise.id}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://api.disguise.id}
      - NEXT_PUBLIC_MEDIAMTX_WHEP_BASE_URL=${NEXT_PUBLIC_MEDIAMTX_WHEP_BASE_URL:-https://stream.disguise.id}
    depends_on:
      - backend

  # ─── 5. REVERSE PROXY & HOST FIREWALL (Caddy) ───────────────
  caddy:
    image: caddy:2-alpine
    container_name: disguise-caddy
    restart: unless-stopped
    ports:
      - "80:80" # Menerima HTTP; Caddyfile langsung menolak akses IP langsung dengan 403 Forbidden
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-disguise.id}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # ─── 6. CLOUDFLARE TUNNEL (Zero Trust Ingress) ──────────────
  # Layanan tunnel keluar (outbound-only). Tidak membutuhkan port masuk terbuka di host!
  # Cukup masukkan token tunnel dari Cloudflare Zero Trust Dashboard ke file .env:
  # CLOUDFLARE_TUNNEL_TOKEN=eyJh...
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: disguise-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

networks:
  default:
    name: disguise-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
